name: Actualizar Precios Entel

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta diariamente a las 8 AM UTC
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Instalar dependencias
      run: npm install

    - name: Ejecutar Scraper de Precios
      run: node scraper.js

    - name: Guardar y publicar cambios en precios.json
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add precios.json || true
        git commit -m "Actualización automática de precios Entel" || exit 0
        git push
